<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 날씨 | 날씨 정보</title>
  <style>
    :root {
      --sky: #78c9f5;
      --deep: #2676b9;
      --ink: #16324f;
      --glass: rgba(255, 255, 255, 0.72);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Pretendard", "Noto Sans KR", Arial, sans-serif;
      color: var(--ink);
      background: linear-gradient(145deg, #a8e2ff 0%, #d8f2ff 45%, #f4fbff 100%);
      display: grid;
      place-items: center;
      padding: 24px;
      overflow-x: hidden;
    }
    .sun-glow {
      position: fixed; width: 280px; height: 280px; border-radius: 50%;
      background: rgba(255, 220, 102, .32); filter: blur(3px);
      top: 6%; right: 8%; pointer-events: none;
    }
    .cloud {
      position: fixed; font-size: 76px; opacity: .22; pointer-events: none;
      animation: float 8s ease-in-out infinite;
    }
    .cloud.one { top: 15%; left: 8%; }
    .cloud.two { bottom: 12%; right: 10%; animation-delay: -3s; font-size: 58px; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    main {
      width: min(100%, 560px);
      position: relative;
      background: var(--glass);
      border: 1px solid rgba(255,255,255,.85);
      border-radius: 30px;
      padding: 34px;
      box-shadow: 0 22px 60px rgba(39, 112, 157, .16);
      backdrop-filter: blur(14px);
    }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .brand { font-weight: 800; letter-spacing: -.5px; font-size: 19px; }
    .pill {
      background: #e6f6ff; color: var(--deep); border-radius: 999px;
      padding: 8px 12px; font-size: 12px; font-weight: 700;
    }
    .location { margin-top: 34px; color: #54718c; font-size: 15px; }
    h1 { font-size: clamp(27px, 6vw, 36px); margin: 7px 0 0; letter-spacing: -1px; }
    .weather {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin: 18px 0 28px;
    }
    .temperature { font-size: clamp(68px, 15vw, 100px); line-height: 1; font-weight: 750; letter-spacing: -6px; }
    .condition { color: #54718c; font-size: 18px; margin-top: 10px; }
    .sun { font-size: clamp(75px, 17vw, 112px); filter: drop-shadow(0 9px 14px rgba(245, 177, 48, .22)); }
    .divider { height: 1px; background: #d7eaf5; margin-bottom: 22px; }
    .details { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .detail {
      background: rgba(255,255,255,.7); border: 1px solid #e4f1f8;
      border-radius: 18px; padding: 16px 10px; text-align: center;
    }
    .detail .icon { font-size: 22px; }
    .detail .label { display: block; color: #66829a; font-size: 12px; margin-top: 8px; }
    .detail .value { display: block; font-weight: 750; font-size: 16px; margin-top: 5px; }
    .notice { margin: 22px 0 0; font-size: 12px; color: #70899d; text-align: center; line-height: 1.6; }
    footer { text-align: center; margin-top: 24px; font-size: 12px; color: #6d8aa1; }
    @media (max-width: 430px) {
      main { padding: 24px 20px; }
      .details { gap: 7px; }
      .detail { padding: 13px 5px; }
      .detail .value { font-size: 14px; }
    }
  </style>
</head>
<body>
  <div class="sun-glow" aria-hidden="true"></div>
  <div class="cloud one" aria-hidden="true">☁</div>
  <div class="cloud two" aria-hidden="true">☁</div>

  <main>
    <header>
      <div class="brand">☀️ 날씨 한눈에</div>
      <div class="pill">오늘의 날씨</div>
    </header>

    <div class="location">대한민국 · 오늘</div>
    <h1>맑고 화창한 날</h1>

    <section class="weather" aria-label="현재 날씨">
      <div>
        <div class="temperature">16°</div>
        <div class="condition">☀️ 맑음</div>
      </div>
      <div class="sun" role="img" aria-label="태양">☀️</div>
    </section>

    <div class="divider"></div>

    <section class="details" aria-label="날씨 상세 정보">
      <div class="detail">
        <div class="icon">🌡️</div>
        <span class="label">체감 온도</span>
        <span class="value">16°C</span>
      </div>
      <div class="detail">
        <div class="icon">💧</div>
        <span class="label">습도</span>
        <span class="value">45%</span>
      </div>
      <div class="detail">
        <div class="icon">💨</div>
        <span class="label">바람</span>
        <span class="value">약함</span>
      </div>
    </section>

    <p class="notice">※ 이 페이지는 웹사이트 제작 연습을 위한 예시 날씨 화면입니다.<br>표시된 날씨 정보는 실제 실시간 관측값이 아닙니다.</p>
    <footer>오늘도 맑고 기분 좋은 하루 보내세요! ☁️</footer>
  </main>
</body>
</html>
